name: Delivery module checks
on:
  push:
    branches: [feature/delivery-notes-en]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: delivery-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: delivery_test
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://delivery_test:local_ci_only@localhost:5432/delivery_test
      DELIVERY_TEST_DATABASE: '1'
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder-not-a-real-secret
      SHOPIFY_APP_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder_not_used
      RESEND_FROM_EMAIL: test@example.test
      SCOPES: read_orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve dependency lockfile
        run: npm install --no-audit --no-fund
      - name: Format new delivery modules
        run: npx prettier --write 'app/lib/delivery*' 'app/routes/*deliver*' app/components/DeliveryUI.jsx app/styles/deliveries.css 'scripts/delivery-*' tests/deliveries/fixtures.mjs docs/DELIVERIES.md package.json
      - name: Validate database migrations
        run: npx prisma validate && npx prisma generate && npx prisma migrate deploy
      - name: Unit and integration tests
        run: |
          mkdir -p test-results
          set -o pipefail
          node --test app/lib/*.test.js tests/artwork/workflow.test.mjs | tee test-results/tests.txt
      - name: Production build
        run: npm run build
      - name: Browser test dependencies
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          CHROME_PATH=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$CHROME_PATH" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          else
            npx playwright install chromium --only-shell
          fi
      - name: Mobile browser and PDF checks
        run: |
          node scripts/delivery-ui-fixture.mjs
          npm run start > test-results/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/delivery >/dev/null && break; sleep 1; done
          node scripts/delivery-browser-check.mjs
          node scripts/artwork-browser-check.mjs
          rm -f test-results/ui-fixture.json
      - name: Preserve tested dependencies and formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/delivery-notes-en'
        run: |
          git add package-lock.json package.json app/lib/delivery* app/routes/*deliver* app/components/DeliveryUI.jsx app/styles/deliveries.css scripts/delivery-* tests/deliveries/fixtures.mjs docs/DELIVERIES.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Lock and format verified delivery modules'
            git push origin HEAD:feature/delivery-notes-en
          fi
      - name: Package review artifacts
        if: always()
        run: |
          mkdir -p test-results
          rm -f test-results/ui-fixture.json
          git archive --format=zip --output=test-results/source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delivery-review-artifacts
          path: test-results/
          retention-days: 7
